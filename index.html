<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iceland 7-Day Kanban Timetable</title>
  <style>
    :root {
      --bg: #0b1220;
      --surface: #151e2e;
      --surface-2: #1e293b;
      --surface-3: #273549;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --nature: #34d399;
      --culture: #a78bfa;
      --food: #fb923c;
      --relax: #f472b6;
      --drive: #64748b;
      --border: #2a3548;
      --shadow: 0 4px 20px rgba(0,0,0,0.4);
      --radius: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      background: linear-gradient(135deg, #0c4a6e, #1e3a5f 60%, #0b1220);
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
      justify-content: space-between;
    }
    header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    header p { color: var(--text-muted); font-size: 0.85rem; }
    .header-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }
    .btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.4rem 0.85rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn:hover { background: var(--accent); color: #0b1220; border-color: var(--accent); }
    .btn.primary {
      background: rgba(56,189,248,0.15);
      color: var(--accent);
      border-color: rgba(56,189,248,0.35);
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      padding: 0.75rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem;
    }
    .legend-item { display: flex; align-items: center; gap: 0.35rem; }
    .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
    .legend-dot.nature { background: var(--nature); }
    .legend-dot.culture { background: var(--culture); }
    .legend-dot.food { background: var(--food); }
    .legend-dot.relax { background: var(--relax); }
    .legend-dot.drive { background: var(--drive); }

    .board-wrap {
      overflow-x: auto;
      padding: 1rem;
      height: calc(100vh - 140px);
    }
    .board {
      display: flex;
      gap: 0.85rem;
      min-width: max-content;
      height: 100%;
    }

    .day-col {
      width: 300px;
      flex-shrink: 0;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: 100%;
    }
    .day-col-header {
      padding: 0.85rem 1rem;
      background: linear-gradient(90deg, rgba(56,189,248,0.12), transparent);
      border-bottom: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .day-col-header h2 {
      font-size: 1rem;
      font-weight: 650;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .day-num {
      background: var(--accent);
      color: #0b1220;
      width: 1.7rem;
      height: 1.7rem;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .day-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }
    .day-title-edit, .day-sub-edit {
      outline: none;
      border-radius: 4px;
      padding: 0 0.2rem;
      cursor: text;
    }
    .day-title-edit:hover, .day-sub-edit:hover {
      background: rgba(56,189,248,0.1);
    }
    .day-title-edit:focus, .day-sub-edit:focus {
      background: rgba(56,189,248,0.18);
      box-shadow: 0 0 0 1px var(--accent);
    }
    h2 .day-title-edit {
      font-size: inherit;
      font-weight: inherit;
    }

    .slots {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .slot {
      background: var(--surface-2);
      border: 1px dashed var(--border);
      border-radius: 8px;
      min-height: 80px;
      padding: 0.45rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .slot.drag-over {
      background: rgba(56,189,248,0.12);
      border-color: var(--accent);
      border-style: solid;
    }
    .slot-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.35rem;
      padding: 0 0.15rem;
    }
    .slot-cards {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      min-height: 32px;
    }

    .memo {
      background: var(--surface-3);
      border-left: 4px solid var(--accent);
      border-radius: 6px;
      padding: 0.55rem 0.65rem;
      cursor: grab;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
      user-select: none;
      position: relative;
    }
    .memo:active { cursor: grabbing; }
    .memo.dragging { opacity: 0.55; transform: scale(0.97); }
    .memo.nature { border-left-color: var(--nature); }
    .memo.culture { border-left-color: var(--culture); }
    .memo.food { border-left-color: var(--food); }
    .memo.relax { border-left-color: var(--relax); }
    .memo.drive { border-left-color: var(--drive); }

    .memo-time {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 0.15rem;
      letter-spacing: 0.02em;
    }
    .memo-title {
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.1rem;
    }
    .memo-note {
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .memo-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      margin-top: 0.3rem;
    }
    .memo-tag {
      font-size: 0.62rem;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      font-weight: 500;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
    }
    .memo-actions {
      position: absolute;
      top: 0.25rem;
      right: 0.3rem;
      display: none;
      gap: 0.15rem;
    }
    .memo:hover .memo-actions { display: flex; }
    .memo-btn {
      background: rgba(0,0,0,0.35);
      border: none;
      color: var(--text-muted);
      width: 18px;
      height: 18px;
      border-radius: 4px;
      font-size: 0.7rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .memo-btn:hover { color: #fff; background: rgba(0,0,0,0.55); }

    .add-zone {
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .add-btn {
      width: 100%;
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      padding: 0.45rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .add-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(56,189,248,0.06);
    }

    .pool-col {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      display: flex;
      flex-direction: column;
      max-height: 100%;
    }
    .pool-col .day-col-header { background: rgba(148,163,184,0.08); }
    .pool-slot { background: transparent; border: none; min-height: auto; padding: 0; }
    .pool-slot .slot-label { display: none; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }
    .modal h3 { font-size: 1.05rem; margin-bottom: 1rem; }
    .form-group { margin-bottom: 0.85rem; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 0.3rem;
    }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.65rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }
    .form-group textarea { min-height: 60px; resize: vertical; }
    .form-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface-3);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 1.2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      z-index: 200;
      transition: transform 0.25s;
      box-shadow: var(--shadow);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 700px) {
      .day-col, .pool-col { width: 280px; }
      header h1 { font-size: 1.15rem; }
    }
    @media print {
      .header-actions, .add-zone, .memo-actions, .pool-col { display: none !important; }
      .board-wrap { overflow: visible; height: auto; }
      .board { flex-wrap: wrap; }
      .day-col { break-inside: avoid; max-height: none; }
      .slots { overflow: visible; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>🇮🇸 Iceland 7-Day Kanban Timetable</h1>
      <p>AM / PM · Click day titles to edit · Edit cards for times · <strong>Reset</strong> if outdated</p>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="resetBoard()">Reset to default</button>
      <button class="btn" onclick="exportJSON()">Export JSON</button>
      <button class="btn primary" onclick="exportImage()">Export PNG</button>
      <button class="btn primary" onclick="exportPDF()">Export PDF</button>
    </div>
  </header>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot nature"></span> Nature</div>
    <div class="legend-item"><span class="legend-dot culture"></span> Culture</div>
    <div class="legend-item"><span class="legend-dot food"></span> Food</div>
    <div class="legend-item"><span class="legend-dot relax"></span> Relax</div>
    <div class="legend-item"><span class="legend-dot drive"></span> Transit</div>
    <div class="legend-item" style="margin-left:auto;color:var(--text-muted)">Drag cards · Edit for exact start/end times</div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <h3 id="modal-title">Edit activity</h3>
      <div class="form-group">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="e.g. Seljalandsfoss" />
      </div>
      <div class="form-group">
        <label>Note</label>
        <textarea id="f-note" placeholder="Optional short note"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Start time (optional)</label>
          <input type="time" id="f-start" />
        </div>
        <div class="form-group">
          <label>End time (optional)</label>
          <input type="time" id="f-end" />
        </div>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select id="f-type">
          <option value="nature">Nature</option>
          <option value="culture">Culture</option>
          <option value="food">Food</option>
          <option value="relax">Relax</option>
          <option value="drive">Transit</option>
        </select>
      </div>
      <div class="form-group">
        <label>Section</label>
        <select id="f-period">
          <option value="am">AM</option>
          <option value="pm">PM</option>
        </select>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn primary" onclick="saveMemo()">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const PERIODS = [
      { id: 'am', label: 'AM · Morning' },
      { id: 'pm', label: 'PM · Afternoon / Evening' },
    ];

    const DAYS = [
      { id: 'd1', num: 1, title: '21 Nov · Arrival', sub: 'Reykjavík' },
      { id: 'd2', num: 2, title: '22 Nov · South Coast D1', sub: 'Skaftafell area' },
      { id: 'd3', num: 3, title: '23 Nov · South Coast D2', sub: 'Return Reykjavík' },
      { id: 'd4', num: 4, title: '24 Nov · Flex', sub: 'Reykjavík' },
      { id: 'd5', num: 5, title: '25 Nov · GC + Aurora', sub: 'Reykjavík' },
      { id: 'd6', num: 6, title: '26 Nov · City / Lagoon', sub: 'Reykjavík' },
      { id: 'd7', num: 7, title: '27 Nov · Departure 11:55', sub: 'Leave ~09:05 · KEF by 09:55' },
    ];

    // memos: { id, dayId, period, title, note, type, start, end }
    const DEFAULT_MEMOS = [
      // Day 1 — 21 Nov
      { id: 'm1', dayId: 'd1', period: 'am', title: 'Land KEF 11:00', note: 'Clearance ~30–45 min', type: 'drive', start: '11:00', end: '' },
      { id: 'm2', dayId: 'd1', period: 'am', title: 'Transfer to downtown', note: 'Flybus / taxi ~50 min', type: 'drive', start: '11:45', end: '12:35' },
      { id: 'm3', dayId: 'd1', period: 'pm', title: 'Check-in + lunch', note: '', type: 'food', start: '13:00', end: '' },
      { id: 'm4', dayId: 'd1', period: 'pm', title: 'Hallgrímskirkja', note: 'Rainbow Street', type: 'culture', start: '', end: '' },
      { id: 'm5', dayId: 'd1', period: 'pm', title: 'How to become Icelandic in 60 min', note: 'Harpa · Kaldalón', type: 'culture', start: '19:00', end: '20:00' },
      { id: 'm6', dayId: 'd1', period: 'pm', title: 'Dinner', note: '', type: 'food', start: '', end: '' },

      // Day 2–3 — 2-Day South Coast + Ice Cave
      { id: 'tour-sc1', dayId: 'd2', period: 'am', title: '★ 2-Day South Coast + Ice Cave', note: '2-day block · Pickup 09:00', type: 'nature', start: '09:00', end: '' },
      { id: 'tour-sc1b', dayId: 'd2', period: 'am', title: '★ Waterfalls', note: 'Seljalandsfoss · Skógafoss', type: 'nature', start: '', end: '' },
      { id: 'tour-sc1c', dayId: 'd2', period: 'pm', title: '★ Reynisfjara', note: 'Black sand beach', type: 'nature', start: '', end: '' },
      { id: 'tour-sc1d', dayId: 'd2', period: 'pm', title: '★ Hotel Skaftafell area', note: 'Overnight + optional NL', type: 'relax', start: '', end: '' },

      { id: 'tour-sc2', dayId: 'd3', period: 'am', title: '★ 2-Day block continues', note: 'Ice cave + lagoon day', type: 'nature', start: '', end: '' },
      { id: 'tour-sc2b', dayId: 'd3', period: 'am', title: '★ Jökulsárlón', note: 'Glacier Lagoon', type: 'nature', start: '', end: '' },
      { id: 'tour-sc2c', dayId: 'd3', period: 'am', title: '★ Diamond Beach', note: '', type: 'nature', start: '', end: '' },
      { id: 'tour-sc2d', dayId: 'd3', period: 'pm', title: '★ Ice Cave', note: 'Crystal or Katla', type: 'nature', start: '', end: '' },
      { id: 'tour-sc2e', dayId: 'd3', period: 'pm', title: '★ Return Reykjavík', note: 'Drop-off ~21:00', type: 'drive', start: '', end: '21:00' },

      // Day 4
      { id: 'm29', dayId: 'd4', period: 'am', title: 'Recovery morning', note: '', type: 'relax', start: '', end: '' },
      { id: 'm30', dayId: 'd4', period: 'am', title: 'Museum / café', note: '', type: 'culture', start: '', end: '' },
      { id: 'm31', dayId: 'd4', period: 'pm', title: 'Lunch', note: '', type: 'food', start: '', end: '' },
      { id: 'm32', dayId: 'd4', period: 'pm', title: 'Free afternoon', note: '', type: 'relax', start: '', end: '' },
      { id: 'm34', dayId: 'd4', period: 'pm', title: 'Pool soak (opt.)', note: '', type: 'relax', start: '', end: '' },
      { id: 'm35', dayId: 'd4', period: 'pm', title: 'Dinner', note: '', type: 'food', start: '', end: '' },

      // Day 5 — Mokka + GC Aurora
      { id: 'm-mokka', dayId: 'd5', period: 'am', title: 'Breakfast · Mokka Kaffi', note: 'Skólavörðustígur', type: 'food', start: '', end: '' },
      { id: 'm-free', dayId: 'd5', period: 'am', title: 'Free morning', note: '', type: 'relax', start: '', end: '' },
      { id: 'tour-gc', dayId: 'd5', period: 'pm', title: '★ Golden Circle Aurora Surprise', note: 'Half-day block · Pickup 12:00', type: 'nature', start: '12:00', end: '' },
      { id: 'tour-gc2', dayId: 'd5', period: 'pm', title: '★ GC continues', note: 'Geysir · Gullfoss · Kerið', type: 'nature', start: '', end: '' },
      { id: 'tour-gc3', dayId: 'd5', period: 'pm', title: '★ GC ends + dinner', note: 'Drop-off Reykjavík', type: 'food', start: '', end: '' },
      { id: 'tour-gc4', dayId: 'd5', period: 'pm', title: '★ Northern Lights hunt', note: 'Pickup ~20:30 · return ~00:00', type: 'nature', start: '20:30', end: '00:00' },

      // Day 6
      { id: 'm36', dayId: 'd6', period: 'am', title: 'Free morning', note: '', type: 'relax', start: '', end: '' },
      { id: 'm37', dayId: 'd6', period: 'am', title: 'City walk / shopping', note: '', type: 'culture', start: '', end: '' },
      { id: 'm38', dayId: 'd6', period: 'pm', title: 'Lunch', note: '', type: 'food', start: '', end: '' },
      { id: 'm40', dayId: 'd6', period: 'pm', title: 'Sky Lagoon (opt.)', note: '', type: 'relax', start: '', end: '' },
      { id: 'm42', dayId: 'd6', period: 'pm', title: 'Dinner', note: '', type: 'food', start: '', end: '' },

      // Day 7 — Departure 11:55
      { id: 'm43', dayId: 'd7', period: 'am', title: 'Breakfast + pack', note: 'Leave hotel ~09:05', type: 'food', start: '', end: '09:05' },
      { id: 'm44', dayId: 'd7', period: 'am', title: 'Transfer to KEF', note: 'Flybus / taxi ~50 min', type: 'drive', start: '09:05', end: '09:55' },
      { id: 'm45', dayId: 'd7', period: 'am', title: 'At KEF', note: '2h before flight', type: 'drive', start: '09:55', end: '' },
      { id: 'm46', dayId: 'd7', period: 'am', title: 'Departure 11:55', note: '', type: 'drive', start: '11:55', end: '' },
    ];

    let memos = [];
    let editingId = null;
    let addTarget = { dayId: null, period: 'am' };
    let draggedId = null;

    let days = [];

    function loadState() {
      try {
        const saved = localStorage.getItem('iceland-kanban-v8');
        if (saved) {
          const data = JSON.parse(saved);
          memos = data.memos || data; // backward compat if array
          if (data.days) days = data.days;
          else days = JSON.parse(JSON.stringify(DAYS));
          return;
        }
      } catch (e) {}
      memos = JSON.parse(JSON.stringify(DEFAULT_MEMOS));
      days = JSON.parse(JSON.stringify(DAYS));
    }
    function saveState() {
      localStorage.setItem('iceland-kanban-v8', JSON.stringify({ memos, days }));
    }
    function uid() {
      return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }

    function formatTimeRange(start, end) {
      if (!start && !end) return '';
      if (start && end) return start + ' – ' + end;
      if (start) return 'from ' + start;
      return 'until ' + end;
    }

    function createMemoEl(m) {
      const el = document.createElement('div');
      el.className = 'memo ' + m.type;
      el.draggable = true;
      el.dataset.id = m.id;
      const timeStr = formatTimeRange(m.start, m.end);
      el.innerHTML = `
        <div class="memo-actions">
          <button class="memo-btn" title="Edit" onclick="event.stopPropagation(); openEditModal('${m.id}')">✎</button>
          <button class="memo-btn" title="Delete" onclick="event.stopPropagation(); deleteMemo('${m.id}')">×</button>
        </div>
        ${timeStr ? `<div class="memo-time">${timeStr}</div>` : ''}
        <div class="memo-title">${escapeHtml(m.title)}</div>
        ${m.note ? `<div class="memo-note">${escapeHtml(m.note)}</div>` : ''}
        <div class="memo-tags"><span class="memo-tag">${m.type}</span></div>
      `;
      el.addEventListener('dragstart', onDragStart);
      el.addEventListener('dragend', onDragEnd);
      return el;
    }

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str || '';
      return d.innerHTML;
    }

    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';

      days.forEach(day => {
        const col = document.createElement('div');
        col.className = 'day-col';
        col.dataset.dayId = day.id;
        col.innerHTML = `
          <div class="day-col-header">
            <h2>
              <span class="day-num">${day.num}</span>
              <span class="day-title-edit" contenteditable="true" data-day-id="${day.id}" data-field="title" spellcheck="false">${escapeHtml(day.title)}</span>
            </h2>
            <div class="day-sub day-sub-edit" contenteditable="true" data-day-id="${day.id}" data-field="sub" spellcheck="false">${escapeHtml(day.sub)}</div>
          </div>
          <div class="add-zone">
            <button class="add-btn" onclick="openAddModal('${day.id}', 'am')">+ Add to Day ${day.num}</button>
          </div>
          <div class="slots" id="slots-${day.id}"></div>
        `;
        // save day heading edits on blur
        col.querySelectorAll('[contenteditable]').forEach(el => {
          el.addEventListener('blur', () => {
            const id = el.dataset.dayId;
            const field = el.dataset.field;
            const d = days.find(x => x.id === id);
            if (d) {
              d[field] = el.textContent.trim();
              saveState();
            }
          });
          el.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
          });
        });
        board.appendChild(col);

        const slotsEl = col.querySelector('.slots');
        PERIODS.forEach(period => {
          const slotDiv = document.createElement('div');
          slotDiv.className = 'slot';
          slotDiv.dataset.dayId = day.id;
          slotDiv.dataset.period = period.id;
          slotDiv.innerHTML = `
            <div class="slot-label">${period.label}</div>
            <div class="slot-cards" data-day="${day.id}" data-period="${period.id}"></div>
          `;
          slotDiv.addEventListener('dragover', onDragOver);
          slotDiv.addEventListener('dragleave', onDragLeave);
          slotDiv.addEventListener('drop', onDrop);
          slotsEl.appendChild(slotDiv);

          const cardsEl = slotDiv.querySelector('.slot-cards');
          const list = memos
            .filter(m => m.dayId === day.id && m.period === period.id)
            .sort((a, b) => (a.start || '99:99').localeCompare(b.start || '99:99'));
          list.forEach(m => cardsEl.appendChild(createMemoEl(m)));
        });
      });

      // Unassigned pool
      const pool = document.createElement('div');
      pool.className = 'pool-col';
      pool.innerHTML = `
        <div class="day-col-header">
          <h2>📋 Unassigned</h2>
          <div class="day-sub">Park cards here</div>
        </div>
        <div class="add-zone">
          <button class="add-btn" onclick="openAddModal('pool', 'pool')">+ New memo</button>
        </div>
        <div class="slots">
          <div class="slot pool-slot" data-day-id="pool" data-period="pool">
            <div class="slot-cards" data-day="pool" data-period="pool" id="pool-cards"></div>
          </div>
        </div>
      `;
      const poolSlot = pool.querySelector('.slot');
      poolSlot.addEventListener('dragover', onDragOver);
      poolSlot.addEventListener('dragleave', onDragLeave);
      poolSlot.addEventListener('drop', onDrop);
      board.appendChild(pool);
      const poolCards = document.getElementById('pool-cards');
      memos.filter(m => m.dayId === 'pool').forEach(m => poolCards.appendChild(createMemoEl(m)));
    }

    function onDragStart(e) {
      draggedId = e.target.dataset.id;
      e.target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', draggedId);
    }
    function onDragEnd(e) {
      e.target.classList.remove('dragging');
      document.querySelectorAll('.slot').forEach(s => s.classList.remove('drag-over'));
      draggedId = null;
    }
    function onDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      e.currentTarget.classList.add('drag-over');
    }
    function onDragLeave(e) {
      e.currentTarget.classList.remove('drag-over');
    }
    function onDrop(e) {
      e.preventDefault();
      const slot = e.currentTarget;
      slot.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain') || draggedId;
      if (!id) return;
      const dayId = slot.dataset.dayId;
      const period = slot.dataset.period;
      const memo = memos.find(m => m.id === id);
      if (!memo) return;
      memo.dayId = dayId;
      memo.period = period === 'pool' ? 'am' : period;
      if (dayId === 'pool') memo.period = 'pool';
      saveState();
      renderBoard();
      showToast('Moved: ' + memo.title);
    }

    function openEditModal(id) {
      const m = memos.find(x => x.id === id);
      if (!m) return;
      editingId = id;
      addTarget = { dayId: null, period: null };
      document.getElementById('modal-title').textContent = 'Edit activity';
      document.getElementById('f-title').value = m.title;
      document.getElementById('f-note').value = m.note || '';
      document.getElementById('f-start').value = m.start || '';
      document.getElementById('f-end').value = m.end || '';
      document.getElementById('f-type').value = m.type;
      document.getElementById('f-period').value = (m.period === 'pm') ? 'pm' : 'am';
      document.getElementById('modal').classList.add('show');
      document.getElementById('f-title').focus();
    }

    function openAddModal(dayId, period) {
      editingId = null;
      addTarget = { dayId, period: period || 'am' };
      document.getElementById('modal-title').textContent = 'Add activity';
      document.getElementById('f-title').value = '';
      document.getElementById('f-note').value = '';
      document.getElementById('f-start').value = '';
      document.getElementById('f-end').value = '';
      document.getElementById('f-type').value = 'nature';
      document.getElementById('f-period').value = period === 'pm' ? 'pm' : 'am';
      document.getElementById('modal').classList.add('show');
      document.getElementById('f-title').focus();
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      editingId = null;
    }

    function saveMemo() {
      const title = document.getElementById('f-title').value.trim();
      if (!title) { showToast('Title is required'); return; }
      const note = document.getElementById('f-note').value.trim();
      const type = document.getElementById('f-type').value;
      const start = document.getElementById('f-start').value;
      const end = document.getElementById('f-end').value;
      const period = document.getElementById('f-period').value;

      if (editingId) {
        const m = memos.find(x => x.id === editingId);
        if (m) {
          m.title = title;
          m.note = note;
          m.type = type;
          m.start = start;
          m.end = end;
          m.period = period;
        }
      } else {
        memos.push({
          id: uid(),
          dayId: addTarget.dayId,
          period: addTarget.period === 'pool' ? 'am' : (period || addTarget.period),
          title, note, type, start, end
        });
        if (addTarget.dayId === 'pool') {
          memos[memos.length - 1].dayId = 'pool';
          memos[memos.length - 1].period = 'pool';
        }
      }
      saveState();
      closeModal();
      renderBoard();
      showToast(editingId ? 'Updated' : 'Added');
    }

    function deleteMemo(id) {
      if (!confirm('Delete this activity?')) return;
      memos = memos.filter(m => m.id !== id);
      saveState();
      renderBoard();
      showToast('Deleted');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    }

    function resetBoard() {
      if (!confirm('Reset to the default 7-day plan? Your changes will be lost.')) return;
      memos = JSON.parse(JSON.stringify(DEFAULT_MEMOS));
      days = JSON.parse(JSON.stringify(DAYS));
      saveState();
      renderBoard();
      showToast('Reset to default');
    }

    function exportJSON() {
      const data = { exported: new Date().toISOString(), days, periods: PERIODS, memos };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'iceland-7day-kanban-plan.json';
      a.click();
      showToast('Exported JSON');
    }

    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    document.getElementById('modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });


    async function exportImage() {
      showToast('Rendering image…');
      const board = document.getElementById('board');
      const wrap = document.querySelector('.board-wrap');
      // temporarily expand so full board is captured
      const prevH = wrap.style.height;
      const prevO = wrap.style.overflow;
      wrap.style.height = 'auto';
      wrap.style.overflow = 'visible';
      board.style.minHeight = board.scrollHeight + 'px';
      try {
        const canvas = await html2canvas(board, {
          backgroundColor: '#0b1220',
          scale: 2,
          useCORS: true,
          logging: false,
          windowWidth: board.scrollWidth,
          windowHeight: board.scrollHeight
        });
        const a = document.createElement('a');
        a.download = 'iceland-7day-timetable.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
        showToast('PNG downloaded');
      } catch (e) {
        console.error(e);
        showToast('Image export failed');
      } finally {
        wrap.style.height = prevH;
        wrap.style.overflow = prevO;
      }
    }

    async function exportPDF() {
      showToast('Rendering PDF…');
      const board = document.getElementById('board');
      const wrap = document.querySelector('.board-wrap');
      const prevH = wrap.style.height;
      const prevO = wrap.style.overflow;
      wrap.style.height = 'auto';
      wrap.style.overflow = 'visible';
      try {
        const canvas = await html2canvas(board, {
          backgroundColor: '#0b1220',
          scale: 2,
          useCORS: true,
          logging: false,
          windowWidth: board.scrollWidth,
          windowHeight: board.scrollHeight
        });
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        // landscape, size based on content
        const pxToMm = 0.264583;
        const wMm = canvas.width * pxToMm;
        const hMm = canvas.height * pxToMm;
        const orientation = wMm > hMm ? 'l' : 'p';
        const pdf = new jsPDF({
          orientation,
          unit: 'mm',
          format: [wMm, hMm]
        });
        pdf.addImage(imgData, 'PNG', 0, 0, wMm, hMm);
        pdf.save('iceland-7day-timetable.pdf');
        showToast('PDF downloaded');
      } catch (e) {
        console.error(e);
        showToast('PDF export failed — try Print instead');
      } finally {
        wrap.style.height = prevH;
        wrap.style.overflow = prevO;
      }
    }

    loadState();
    renderBoard();
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</body>
